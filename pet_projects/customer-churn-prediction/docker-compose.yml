# ============================================
# DOCKER COMPOSE - ORCHESTRATE ALL SERVICES
# ============================================

services:
  # ============================================
  # TEST RUNNER SERVICE
  # ============================================
  # Runs pytest before starting API
  # If tests fail, API won't start
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: pytest app/tests/ -v              # Override default CMD
    restart: "no"                          # Run once and exit

  # ============================================
  # FASTAPI BACKEND SERVICE
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: churn-api
    ports:
      - "8000:8000"                        # Host:Container port mapping
    volumes:
      - ./app/data:/app/app/data           # Persist database
      - ./app/models:/app/app/models       # Persist models
      - ./app/logs:/app/app/logs           # Persist logs
      - ./app/metrics:/app/app/metrics     # Persist metrics
    depends_on:
      test-runner:
        condition: service_completed_successfully  # Wait for tests to pass
    restart: unless-stopped                # Auto-restart on crash

  # ============================================
  # STREAMLIT DASHBOARD SERVICE
  # ============================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: churn-dashboard
    ports:
      - "8501:8501"
    depends_on:
      - api                                # Wait for API to be healthy
    environment:
      - API_URL=http://api:8000            # Internal Docker network address
    restart: unless-stopped