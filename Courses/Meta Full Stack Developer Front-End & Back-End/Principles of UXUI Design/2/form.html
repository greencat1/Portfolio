<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Enhancement Lab</title>
    <link rel="stylesheet" href="form.css">
</head>

<body>
    <h1>Sample Form</h1>

    <!-- START: Form container -->
    <form action="#" method="POST">

        <!-- START: Name field -->
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <!-- START: Email field -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">

        <!-- START: Phone Number field -->
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone">

        <!-- START: Address field -->
        <label for="address">Shipping Address:</label>
        <input type="text" id="address" name="address" placeholder="Give your shipping address" required>

        <!-- START: Password field -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password">

        <!-- START: Submit button -->
        <button type="submit">Submit</button>
        <!-- COMMENT: Button functionality is to submit the form. -->
        <!-- COMMENT: Style the button in the CSS file for better presentation. -->

    </form>
    <!-- END: Form container -->

</body>

</html>
