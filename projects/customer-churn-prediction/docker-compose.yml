# ============================================
# DOCKER COMPOSE - ORCHESTRATE ALL SERVICES
# ============================================

services:
  # ============================================
  # FASTAPI BACKEND SERVICE
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: churn-api
    ports:
      - "8000:8000"
    volumes:
      - ./app/data:/app/app/data
      - ./app/models:/app/app/models
      - ./app/logs:/app/app/logs
      - ./app/metrics:/app/app/metrics
    restart: unless-stopped

  # ============================================
  # STREAMLIT DASHBOARD SERVICE
  # ============================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: churn-dashboard
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000
    restart: unless-stopped